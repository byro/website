[root]
title = "byro – freie Mitgliederverwaltung für Vereine"
description = "byro ist eine freie, selbst gehostete Mitgliederverwaltung für kleine und mittelgroße Vereine, NGOs und Verbände. Diese Website gibt es auf Deutsch und Englisch."
heading = "byro – freie Mitgliederverwaltung für Vereine"
lead = "byro ist eine einfache, selbst gehostete Mitgliederverwaltung für kleine und mittelgroße Vereine, NGOs und Verbände mit Schwerpunkt auf der DACH-Region."
choose = "Bitte wähle deine Sprache:"
german = "Deutsch"
german_hint = "Zur deutschen Website"
english = "English"
english_hint = "Go to the English website"

[home]
title = "byro – Open-Source-Mitgliederverwaltung für Vereine"
description = "byro ist eine freie, selbst gehostete Mitgliederverwaltung für kleine und mittelgroße Vereine, NGOs und Verbände mit Schwerpunkt auf der DACH-Region."
eyebrow = "Freie Software für Vereine"
heading = "Mitgliederverwaltung für Vereine, die du selbst betreibst"
lead = "byro ist eine einfache Mitgliederverwaltung für kleine und mittelgroße Vereine, NGOs und Verbände mit Schwerpunkt auf der DACH-Region. byro ist stabil, in mehreren Communities im Einsatz und wird aktiv weiterentwickelt."
cta_docs = "Dokumentation lesen"
cta_github = "Quellcode auf GitHub"
cta_demo = "Demo ausprobieren"
hero_alt = "Mitgliederliste in byro mit Mitgliedsnummer, Name und Kontostand sowie Schaltflächen zum Hinzufügen, Exportieren und Importieren von Mitgliedern"
screenshot_caption = "byro v2026.4.0 mit Testdaten"

features_heading = "Was byro kann"
features_intro = "byro deckt die Verwaltungsarbeit rund um Mitglieder, Beiträge und Zahlungen ab. Was fehlt, lässt sich über Plugins ergänzen."

[[home.features]]
icon = "users"
title = "Mitglieder und Beiträge"
text = "Mitglieder und ihre Daten anlegen und bearbeiten, Mitgliedschaften mit Beitrag und Zahlungsintervall verwalten."

[[home.features]]
icon = "banknote"
title = "Zahlungen zuordnen"
text = "Banktransaktionen importieren und Mitgliedern zuordnen. Das offizielle Plugin liest Kontoauszüge im Format CAMT.053 und MT940."

[[home.features]]
icon = "mails"
title = "E-Mails und Dokumente"
text = "Mails vor dem Versand prüfen, Vorlagen anpassen und Dokumente für oder von Mitgliedern ablegen, auf Wunsch mit automatischem Versand."

[[home.features]]
icon = "id-card"
title = "Mitgliederbereich"
text = "Jedes Mitglied hat eine eigene Seite mit seinen Buchungen und kann Änderungen an seinen Daten vorschlagen. Über das Mitgliederverzeichnis finden sich Mitglieder untereinander."

[[home.features]]
icon = "shield-check"
title = "Mehr-Faktor-Anmeldung"
text = "Zugänge zur Verwaltung lassen sich mit einer Authenticator-App (TOTP) schützen. Administratoren können das für alle vorschreiben."

[[home.features]]
icon = "puzzle"
title = "Plugins und REST-API"
text = "Plugins ergänzen Importer, eigene Mitgliedsdaten oder ganze Funktionen. Über die REST-API lassen sich andere Systeme anbinden."

[[home.showcase]]
image = "member-overview"
heading = "Jedes Mitglied auf einen Blick"
text = "Die Übersicht eines Mitglieds zeigt den Status, den aktuellen Kontostand, offene und verjährte Beiträge, die Dauer der Mitgliedschaft und den vereinbarten Beitrag."
alt = "Übersicht eines Mitglieds in byro mit Status „aktiv“, Kontostand, ausstehenden und verjährten Beiträgen, Mitgliedsdauer und monatlichem Beitrag"

[[home.showcase]]
image = "bank-account"
heading = "Finanzen nachvollziehen"
text = "Banktransaktionen landen auf den Konten des Vereins. Jede einzelne Buchung bleibt nachvollziehbar, und Transaktionen, die noch keinem Mitglied zugeordnet sind, zeigt byro gesondert an."
alt = "Bankkonto in byro mit einer Liste von Transaktionen: Datum, Verwendungszweck sowie Zu- und Abgängen"

[home.selfhosted]
heading = "Du betreibst byro selbst"
text = "byro ist kein gehosteter Dienst. Du installierst es auf einem eigenen Server, oder jemand aus deiner Organisation oder deinem Umfeld betreibt es für euch. Wer byro betreibt, ist für die persönlichen und finanziellen Daten der Mitglieder verantwortlich."
methods_intro = "Die Dokumentation beschreibt drei Installationswege:"
not_heading = "Was byro nicht ist"
not_text = "byro unterstützt Buchungen und Transaktionen, ist aber (noch) keine vollständige Buchhaltungssoftware. Veranstaltungen oder Ticketing deckt byro ebenfalls nicht ab."

[[home.selfhosted.methods]]
title = "byroctl"
note = "empfohlen"
text = "Ein Kommandozeilenwerkzeug, das byro mit Docker Compose einrichtet und Updates einspielt."
docs_path = "installation/byroctl/"

[[home.selfhosted.methods]]
title = "Docker Compose"
text = "Dasselbe Container-Image, verwaltet mit gewöhnlichen <code>docker compose</code>-Befehlen."
docs_path = "installation/docker-compose/"

[[home.selfhosted.methods]]
title = "Bare Metal"
text = "byro aus PyPI mit PostgreSQL, gunicorn, systemd und eigenem Reverse Proxy."
docs_path = "installation/bare-metal/"

